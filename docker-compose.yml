# Despliegue de referencia: API + trabajador en un contenedor y PostgreSQL 16.
# Secretos en .env (ver .env.example); nunca en este archivo.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: em
      POSTGRES_USER: em
      POSTGRES_PASSWORD: ${EM_PG_CLAVE:?Defina EM_PG_CLAVE en .env}
    volumes: [pgdatos:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U em -d em"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  em:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      EM_BASE_DATOS: postgres://em:${EM_PG_CLAVE}@db:5432/em
    ports: ["8080:8080"]
    volumes: [datos:/datos]
    restart: unless-stopped

volumes:
  pgdatos:
  datos:
